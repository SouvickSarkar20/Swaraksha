name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Grant the GITHUB_TOKEN permission to push Docker images to the registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # This automatically caches the node_modules folder to drastically speed up CI runs!
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 Run Type Checking
        # We run the build script to ensure strict TypeScript compilation passes
        run: npm run build

      - name: 🧪 Run Unit Tests (Vitest)
        run: npm run test
        env:
          # We supply dummy secrets so env.ts validation doesn't crash the CI runner!
          JWT_SECRET: "test-secret-key-that-is-at-least-32-chars-long"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
          REDIS_URL: "https://dummy.upstash.io"
          REDIS_TOKEN: "dummy_token"

      - name: 🐳 Verify Docker Build (Phase 1 execution)
        run: docker build -t swaraksha-api:test .

  deploy:
    name: 🚀 Deploy to Production
    needs: build-and-test
    # ONLY run deployment if the code was pushed to main (not on Pull Requests)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the automatic GITHUB_TOKEN to authenticate
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker image
        run: |
          # The repository name needs to be lowercase for Docker tags
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO/swaraksha-api:latest .
          docker push ghcr.io/$REPO/swaraksha-api:latest

      - name: 🚀 Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pass the temporary GitHub token so the server can download the private image
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GH_TOKEN,REPO
          script: |
            # Convert REPO to lowercase
            LOWER_REPO=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

            # 1. Login to GHCR on the Droplet
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the latest image
            docker pull ghcr.io/$LOWER_REPO/swaraksha-api:latest

            # 3. Securely inject GitHub Secrets into the production .env file
            cat <<EOF > /root/.env
            PORT=3000
            NODE_ENV=production
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            REDIS_URL=${{ secrets.PROD_REDIS_URL }}
            REDIS_TOKEN=${{ secrets.PROD_REDIS_TOKEN }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            EOF

            # 4. Copy docker-compose blueprint
            cat <<EOF > /root/docker-compose.yml
            version: "3.8"
            services:
              api:
                image: ghcr.io/$LOWER_REPO/swaraksha-api:latest
                container_name: swaraksha-api
                restart: unless-stopped
                ports:
                  - "3000:3000"
                env_file:
                  - .env
            EOF

            # 5. Stop old container, start new container seamlessly
            cd /root
            docker compose up -d

            # 6. Wait until the container is running before migrating
            for i in {1..30}; do
              if docker ps --filter "name=^/swaraksha-api$" --filter "status=running" --format '{{.Names}}' | grep -q '^swaraksha-api$'; then
                break
              fi
              sleep 2
            done

            # 7. Fail fast if the container never started
            if ! docker ps --filter "name=^/swaraksha-api$" --filter "status=running" --format '{{.Names}}' | grep -q '^swaraksha-api$'; then
              echo "Container swaraksha-api did not start"
              docker ps -a
              exit 1
            fi

            # 8. Run Production Database Migrations safely INSIDE the new container
            docker exec swaraksha-api node dist/db/migrate.js
